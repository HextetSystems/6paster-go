# Apache VirtualHost example. Enable proxy, proxy_http, headers, rewrite, and ssl.
# Replace hostname and certificate paths before enabling.
<VirtualHost *:80>
    ServerName paste.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName paste.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/paste.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/paste.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/$
    RewriteCond %{REQUEST_URI} !^/robots\.txt$
    RewriteCond %{REQUEST_URI} !^/health$
    RewriteCond %{REQUEST_URI} !^/metrics$
    RewriteCond %{REQUEST_URI} !^/p/[A-Za-z0-9]{24}/?$
    RewriteRule ^ - [R=404,L]

    <Location /metrics>
        Require local
    </Location>

    ProxyPass / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
