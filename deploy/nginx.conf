# Nginx site configuration for a host-level reverse proxy in front of the
# compose.ghcr.yaml deployment. Replace paste.example.com and the certificate
# paths before enabling this file.

server {
    listen 80;
    listen [::]:80;
    server_name paste.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paste.example.com;

    ssl_certificate /etc/letsencrypt/live/paste.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep this above SIXPASTER_PASTE_MAXIMUM_BYTES plus multipart overhead.
    client_max_body_size 1m;

    # These are the only routes served by 6paster when SERVER_BASE_PATH=/.
    # Keep /health at the root even when using a different base path.
    location = / {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ "^/p/[A-Za-z0-9]{24}/?$" {
        proxy_pass http://127.0.0.1:8080;
    }

    # Do not send arbitrary probes or unknown paths to the application.
    location / {
        return 404;
    }

    # Proxy settings are inherited by each proxied location above.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
