# Nginx site configuration for a host-level reverse proxy in front of the
# compose.ghcr.yaml deployment. Replace paste.example.com and the certificate
# paths before enabling this file.

server {
    listen 80;
    listen [::]:80;
    server_name paste.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paste.example.com;

    ssl_certificate /etc/letsencrypt/live/paste.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep this above SIXPASTER_PASTE_MAXIMUM_BYTES plus multipart overhead.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
